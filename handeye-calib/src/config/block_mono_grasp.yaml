# 无 Tag 检测、标定、示教和抓取的唯一参数源；修改后重新启动命令生效。
model_path: /home/eaibot/handeye-calib/src/model/yolov5/block_occlusion_yolov5n_640_best.onnx

target_classes:
  power:
    target_id: 1
    class_id: 0
    class_name: Emergency power supply device
  fire:
    target_id: 2
    class_id: 1
    class_name: Fire extinguishing device
  gas:
    target_id: 3
    class_id: 2
    class_name: Gas purification device
  support:
    target_id: 4
    class_id: 3
    class_name: Structural support device

target_size_mm: 30.0
target_height_mm: 30.0
# 2026-08-08：640 遮挡模型使用 340~460mm、400mm 附近加密数据完成标定。
distance_method: calibrated

input_size: 640
confidence_min: 0.70
nms_iou: 0.45
# 与有 Tag 正式抓取一致：确认 5 个新鲜稳定观测后立即继续。
frames_required: 5
observation_timeout: 50.0
image_max_age_seconds: 1.0
box_width_min_px: 30.0
box_aspect_ratio_min: 0.75
box_aspect_ratio_max: 1.30
center_std_max_px: 2.0
width_cv_max: 0.03
# 与有 Tag 底盘对准区域一致；目标框中心必须进入该区域才允许采样或抓取。
grasp_roi_ratio: [0.06, 0.00, 0.28, 1.00]

# A/B 共用的抓取前中转点；只读取该文件的 pre_pick_transit_joint_values。
pre_pick_transit_preset_file: /home/eaibot/handeye-calib/config/tag_pick_place_presets.json

# 无 Tag 底盘慢速对准并逐个抓取；动作顺序与有 Tag 自动抓取一致。
chassis_sequence:
  order: left_to_right
  cmd_vel_topic: /cmd_vel
  drive_speed: 0.012
  align_tolerance_px: 12.0
  stable_frames: 4
  chassis_settle_seconds: 0.8
  # 只有连续这么久没有向红框靠近才超时；正常移动有进展会自动续期。
  max_align_seconds: 25.0
  progress_reset_px: 3.0
  control_hz: 5.0
  # ONNX 推理期间继续按 control_hz 刷新速度；超过此时间没有新检测就自动停车。
  command_max_age_seconds: 1.0
  target_right_motion: forward

# 必须使用已经由相机标定参数矫正过的 RGB 图像；本方案不使用深度图。
rgb_topic: /camera/rgb/image_rect_color
camera_info_topic: /camera/rgb/camera_info
rgb_timeout: 5.0
camera_frame: camera_rgb_optical_frame
base_frame: base
tf_timeout: 5.0
distance_models:
  # calibrated 模式分别拟合 Z=a/框宽+b 和 Z=a/框高+b，再取中位数。
  power:
    width: { a: 14269.728509, b: 81.634499 }
    height: { a: 11809.996856, b: 127.485117 }
  fire:
    width: { a: 14013.121021, b: 59.004395 }
    height: { a: 12965.356254, b: 91.544317 }
  gas:
    width: { a: 13519.894585, b: 66.290730 }
    height: { a: 12215.926348, b: 91.709023 }
  support:
    width: { a: 14319.186286, b: 86.567008 }
    height: { a: 11848.800579, b: 131.191055 }

# 0 表示不因宽/高两轴估距差异阻断抓取，最终距离取两者中位数。
max_axis_distance_disagreement_mm: 0.0

fixed_z_mm: 330.0
# 无 Tag 示教时先自动停在检测目标表面前 85mm，再由 RViz 微调并保存未接触预抓点 P。
teach_assist_distance_mm: 85.0
# 正式抓取先规划到 P 后方 40mm，再保持姿态直线移动到 P。
approach_gap_mm: 40.0
# 视觉和示教只负责把吸盘送到 P；限位开关决定真实接触位置。
contact_probe:
  max_travel_mm: 65.0
  # P 后方安全点到 P：限位已开启，但使用较大的直线采样步长。
  staging_step_mm: 5.0
  # 从 P 继续寻找真实接触点时保持精细步长。
  step_mm: 2.0
  point_interval_seconds: 0.5
  poll_seconds: 0.02
  # 吸附后沿原接近轴退到预抓点后方 40mm，再进行搬运规划。
  retreat_extra_mm: 40.0
velocity_scale: 0.20
acceleration_scale: 0.20
planning_time: 5.0
motion_settle_seconds: 0.25
base_min_z_mm: 40.0
base_max_radius_mm: 500.0
