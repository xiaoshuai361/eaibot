model_path: /home/eaibot/handeye-calib/src/model/yolov5/Block_v5n_yolov5n_640_best.onnx

target_classes:
  power:
    class_id: 0
    class_name: Emergency power supply device
  fire:
    class_id: 1
    class_name: Fire extinguishing device
  gas:
    class_id: 2
    class_name: Gas purification device
  support:
    class_id: 3
    class_name: Structural support device

target_size_mm: 30.0
# 初始调试值：按目前 fire 样例的单目估计距离约 330mm。
# 先用 fixed_plane 跑 --dry-run / --stop-at-pre-grasp；后面标定后可改 calibrated。
distance_method: fixed_plane

input_size: 640
confidence_min: 0.70
nms_iou: 0.45
frames_required: 10
box_width_min_px: 30.0
box_aspect_ratio_min: 0.75
box_aspect_ratio_max: 1.30
center_std_max_px: 2.0
width_cv_max: 0.03

rgb_topic: /camera/rgb/image_raw
camera_info_topic: /camera/rgb/camera_info
rgb_timeout: 5.0
camera_frame: camera_rgb_optical_frame
base_frame: base
tf_timeout: 5.0

distance_models:
  # calibrated 模式使用 Z_mm = a / 框宽px + b。
  # 下面 a≈15800, b=0 是由当前样例粗估出来的理论初值，不是最终标定值。
  power: { a: 15800.0, b: 0.0 }
  fire: { a: 15800.0, b: 0.0 }
  gas: { a: 15800.0, b: 0.0 }
  support: { a: 15800.0, b: 0.0 }

fixed_z_mm: 330.0
target_offset_mm: [0.0, 0.0, 0.0]
# 初始只测“运行到目标前方 8cm”，先不补偿吸盘 TCP 偏移。
# 后续真抓取前必须按实际吸盘相对 MoveIt 末端的毫米偏移重新测。
tool_offset_mm: [0.0, 0.0, 0.0]
fixed_orientation_xyzw: null

pregrasp_distance_mm: 80.0
approach_distance_mm: 60.0
suction_compression_mm: 3.0
velocity_scale: 0.05
acceleration_scale: 0.05
planning_time: 5.0
base_min_z_mm: 40.0
base_max_radius_mm: 500.0
max_retries: 2
