model_path: /home/eaibot/handeye-calib/src/model/yolov5/Block_v5n_yolov5n_640_best.onnx

target_classes:
  power:
    class_id: 0
    class_name: Emergency power supply device
  fire:
    class_id: 1
    class_name: Fire extinguishing device
  gas:
    class_id: 2
    class_name: Gas purification device
  support:
    class_id: 3
    class_name: Structural support device

target_size_mm: 30.0
target_height_mm: 30.0
# 2026-08-06 真机使用 280~480mm、每 20mm 一点的 11 点数据完成标定。
distance_method: calibrated

input_size: 640
confidence_min: 0.70
nms_iou: 0.45
# 与有 Tag 正式抓取一致：确认 5 个新鲜稳定观测后立即继续。
frames_required: 5
observation_timeout: 50.0
image_max_age_seconds: 1.0
box_width_min_px: 30.0
box_aspect_ratio_min: 0.75
box_aspect_ratio_max: 1.30
center_std_max_px: 2.0
width_cv_max: 0.03
# 与有 Tag 底盘对准区域一致；目标框中心必须进入该区域才允许采样或抓取。
grasp_roi_ratio: [0.06, 0.00, 0.24, 1.00]

# 必须使用已经由相机标定参数矫正过的 RGB 图像；本方案不使用深度图。
rgb_topic: /camera/rgb/image_rect_color
camera_info_topic: /camera/rgb/camera_info
rgb_timeout: 5.0
camera_frame: camera_rgb_optical_frame
base_frame: base
tf_timeout: 5.0

distance_models:
  # calibrated 模式分别拟合 Z=a/框宽+b 和 Z=a/框高+b，再取中位数。
  power:
    width: {a: 16598.928264, b: 45.828631}
    height: {a: 15448.423847, b: 27.770073}
  fire:
    width: {a: 17737.571665, b: 21.855549}
    height: {a: 15854.146450, b: 21.662911}
  gas:
    width: {a: 15816.238163, b: 47.952372}
    height: {a: 15776.580229, b: 27.768355}
  support:
    width: {a: 18090.771611, b: 26.953169}
    height: {a: 17880.867838, b: 19.173962}

max_axis_distance_disagreement_mm: 20.0

fixed_z_mm: 330.0
pregrasp_distance_mm: 80.0
velocity_scale: 0.05
acceleration_scale: 0.05
planning_time: 5.0
motion_settle_seconds: 0.25
base_min_z_mm: 40.0
base_max_radius_mm: 500.0
