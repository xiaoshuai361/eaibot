# 无 Tag 楼宇接触投递 P 示教：复用 Astra RGB、CameraInfo 和手眼 TF。
model_path: /home/eaibot/handeye-calib/src/model/yolov5/building_new_yolov5n_320_best.onnx

target_classes:
  power:
    target_id: 1
    class_id: 1
    class_name: Electrical Fault Building
  fire:
    target_id: 2
    class_id: 2
    class_name: Fire Building
  gas:
    target_id: 3
    class_id: 3
    class_name: Toxic Gas-contaminated Building
  support:
    target_id: 4
    class_id: 0
    class_name: Collapsed Building

distance_method: calibrated
distance_calibration_file: /home/eaibot/handeye-calib/config/building_delivery_calibration.json
input_size: 320
confidence_min: 0.65
nms_iou: 0.45
frames_required: 5
observation_timeout: 50.0
image_max_age_seconds: 1.0
box_width_min_px: 20.0
# 楼宇上下边可能被裁切，不用高宽比阻断；左右边必须完整。
box_aspect_ratio_min: 0.01
box_aspect_ratio_max: 100.0
horizontal_box_margin_px: 2.0
center_std_max_px: 3.0
width_cv_max: 0.03
grasp_roi_ratio: [0.17, 0.00, 0.54, 1.00]

rgb_topic: /camera/rgb/image_rect_color
camera_info_topic: /camera/rgb/camera_info
rgb_timeout: 5.0
camera_frame: camera_rgb_optical_frame
base_frame: base
tf_timeout: 5.0

# 楼宇示教先到检测楼面前40mm，再由RViz微调P。
teach_assist_distance_mm: 40.0
# 楼宇框上下边可能被裁切；辅助点使用此前无 Tag 真机约119mm的可达高度。
teach_assist_base_z_mm: 120.0
velocity_scale: 0.05
acceleration_scale: 0.05
planning_time: 5.0
motion_settle_seconds: 0.25
base_min_z_mm: 40.0
base_max_radius_mm: 500.0
